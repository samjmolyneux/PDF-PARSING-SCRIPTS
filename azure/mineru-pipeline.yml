$schema: https://azuremlschemas.azureedge.net/latest/pipelineComponent.schema.json
name: pdf_mineru_pipeline
version: "11"
type: pipeline
inputs:
  pdfs:
    type: uri_folder
outputs:
  results:
    type: uri_folder
    mode: rw_mount
jobs:
  parse:
    type: command
    component: ./mineru-command.yml
    # Runtime variables belong to this job, not the reusable command component.
    environment_variables:
      PYTHONUNBUFFERED: "1"
      HF_HUB_OFFLINE: "1"
      MINERU_MODEL_SOURCE: local
      # Allow long native tasks to run up to Azure's whole-job deadline.
      MINERU_TASK_RESULT_TIMEOUT_SECONDS: "86400"
    inputs:
      pdfs: ${{parent.inputs.pdfs}}
    outputs:
      results: ${{parent.outputs.results}}
    limits:
      timeout: 86400 # 24 hours for the whole batch.
