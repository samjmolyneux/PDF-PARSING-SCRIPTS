$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: pdf_mineru_command
version: "5"
type: command
is_deterministic: false
code: ../workers
environment: azureml:pdf-mineru:5
inputs:
  pdfs:
    type: uri_folder
    mode: download
outputs:
  results:
    type: uri_folder
    mode: rw_mount
command: >-
  python3 run.py --parser mineru --input "${{inputs.pdfs}}"
  --output "${{outputs.results}}"
resources:
  instance_count: 1
  shm_size: 64g
