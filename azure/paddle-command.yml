$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: paddle_vl_command
version: '3'
type: command
is_deterministic: false
code: ../workers
environment: azureml:pdf-paddle:3
inputs:
  models:
    type: custom_model
    mode: download
  pdfs:
    type: uri_folder
    mode: download
outputs:
  results:
    type: uri_folder
    mode: rw_mount
command: >-
  bash start_paddle_client.sh --parser paddle --input "${{inputs.pdfs}}"
  --models "${{inputs.models}}"
  --output "${{outputs.results}}"
environment_variables:
  PYTHONUNBUFFERED: '1'
  HF_HUB_OFFLINE: '1'
  # The server launcher deactivates Conda before running the original image's Python.
  PADDLE_SERVER_PYTHON: /usr/local/bin/python
  PADDLE_SERVER_CLI: /usr/local/bin/paddleocr
resources:
  instance_count: 1
  shm_size: 64g
