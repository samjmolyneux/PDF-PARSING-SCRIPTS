$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: paddle_vl_command
version: "4"
type: command
is_deterministic: false
code: ../workers
environment: azureml:pdf-paddle:3
inputs:
  models:
    type: custom_model
    mode: download
  pdfs:
    type: uri_folder
    mode: download
outputs:
  results:
    type: uri_folder
    mode: rw_mount
command: >-
  bash start_paddle_client.sh --parser paddle --input "${{inputs.pdfs}}"
  --models "${{inputs.models}}"
  --output "${{outputs.results}}"
resources:
  instance_count: 1
  shm_size: 64g
